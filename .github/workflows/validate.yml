# A pull request: every plugin is checked the way the launcher will read it, and one whose files changed
# has to have a new version. Nothing is published.

name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # the check compares with the branch the pull request is for

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The program the plugins are for reads their manifests (`modkit.exe mods check`), so what passes here
      # is what loads there. Which version of it is written in .github/modkit-version, so a change of the
      # checker is a change in this repository; it is downloaded from that release's own address (no API, no
      # token) and has to match the checksum published beside it.
      - name: Get modkit.exe
        shell: pwsh
        run: |
          $version = (Get-Content .github/modkit-version -Raw).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'modkit'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://github.com/Yueby/wuwatappo-modkit/releases/download/v$version"
          foreach ($file in 'modkit.exe', 'modkit.exe.sha256') {
            Write-Output "$base/$file"
            Invoke-WebRequest -Uri "$base/$file" -OutFile (Join-Path $dir $file) -MaximumRetryCount 3 -RetryIntervalSec 5
          }
          $expected = ((Get-Content (Join-Path $dir 'modkit.exe.sha256') -Raw) -split '\s+')[0].ToLower()
          $actual = (Get-FileHash (Join-Path $dir 'modkit.exe') -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "modkit.exe $version does not match its checksum ($actual instead of $expected)" }
          & (Join-Path $dir 'modkit.exe') --version
          "MODKIT_EXE=$(Join-Path $dir 'modkit.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - run: node scripts/build.mjs --base origin/${{ github.base_ref }}
