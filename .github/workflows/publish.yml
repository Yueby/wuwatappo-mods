# Something was merged: each plugin version that has no release gets one (tag <id>-v<version>, the zip as its
# asset), and index.json, which is what the launcher lists, is replaced on the release called "index".
# A version that is already released is never touched.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write                        # releases

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The plugins' own tests (a stand-in for the app: nothing here touches an account).
      - run: npm test

      # See validate.yml: the version of the checker is pinned in .github/modkit-version, and downloaded from
      # its release's own address.
      - name: Get modkit.exe
        shell: pwsh
        run: |
          $version = (Get-Content .github/modkit-version -Raw).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'modkit'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://github.com/Yueby/wuwatappo-modkit/releases/download/v$version"
          foreach ($file in 'modkit.exe', 'modkit.exe.sha256') {
            Write-Output "$base/$file"
            Invoke-WebRequest -Uri "$base/$file" -OutFile (Join-Path $dir $file) -MaximumRetryCount 3 -RetryIntervalSec 5
          }
          $expected = ((Get-Content (Join-Path $dir 'modkit.exe.sha256') -Raw) -split '\s+')[0].ToLower()
          $actual = (Get-FileHash (Join-Path $dir 'modkit.exe') -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "modkit.exe $version does not match its checksum ($actual instead of $expected)" }
          & (Join-Path $dir 'modkit.exe') --version
          "MODKIT_EXE=$(Join-Path $dir 'modkit.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs --publish
